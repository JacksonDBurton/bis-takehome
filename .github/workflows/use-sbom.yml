
name: SBOM on Release

on:
  workflow_dispatch:
  
jobs:
  scan:
    uses: ./.github/workflows/anchore-sbom-scan.yml
    with:
      scan-target: docker
      image-tag: my-release:latest
      sbom-format: syft-json

  attach-artifacts:
    name: Upload SBOM 
    needs: scan
    runs-on: ubuntu-latest

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: artifacts
